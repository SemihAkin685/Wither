name: Bug report
description: Something in Wither is broken or behaves unexpectedly
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. Please search existing issues first, and report security problems privately as described in SECURITY.md instead of here.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the sample workspace
        2. Open behavior_pack/manifest.json
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Wither version
      description: Shown on the welcome screen and in Settings, About.
      placeholder: "0.1.0"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - Windows
        - macOS
    validations:
      required: true

  - type: input
    id: os-details
    attributes:
      label: OS version and desktop environment
      placeholder: "Fedora 44, KDE Plasma on Wayland"

  - type: textarea
    id: logs
    attributes:
      label: Logs and screenshots
      description: Relevant lines from the Output panel, terminal output from npm run dev, or screenshots.
      render: text
